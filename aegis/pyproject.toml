[project]
name = "aegis-control"
version = "0.1.0"
description = "AEGIS control plane: trust, govern, and prove enterprise agents."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.6",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "httpx>=0.27",
    "slowapi>=0.1.9",
    "typer>=0.12",
    "run-replay>=1.0.0",
    "evalforge>=1.0.0",
    "agent-sentinel>=0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "bandit", "pip-audit"]

[project.scripts]
aegis = "aegis.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# B008 (Depends in default arg) is the standard FastAPI pattern; not a bug here.
extend-ignore = ["B008"]
extend-select = ["E", "F", "I", "BLE", "SIM", "RUF", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
# Third-party engines (evalforge / agent_sentinel / run_replay) ship no type
# stubs; treat their untyped surfaces as dynamic rather than failing the gate.
[[tool.mypy.overrides]]
module = ["evalforge", "agent_sentinel", "run_replay", "run_replay.models"]
ignore_missing_imports = true
allow_untyped_defs = true
disable_error_code = ["attr-defined", "import-untyped", "no-redef"]
# SQLAlchemy ORM model files: mypy cannot resolve Column descriptors without the
# (deprecated for 2.0) plugin. Scope the strict gate to business logic; the
# runtime behaviour is covered by the test suite.
[[tool.mypy.overrides]]
module = ["aegis.spine", "causa.*"]
disable_error_code = ["valid-type", "misc", "return-value", "arg-type", "assignment", "index", "union-attr"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "playwright: marks tests that drive the live UI in a browser",
]
