name: quality-gate

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit pytest pytest-asyncio
          for p in aegis packages/run-replay packages/evalforge packages/agent-sentinel packages/token-governor packages/meshwork; do
            if [ -f "$p/pyproject.toml" ]; then pip install -e "./$p" --no-deps || true; fi
          done
      - name: Ruff
        run: ruff check aegis/src packages/run-replay/src packages/evalforge/src packages/agent-sentinel/src packages/token-governor/src packages/meshwork/src
      - name: Mypy
        run: mypy aegis/src/aegis --config-file aegis/pyproject.toml --no-error-summary
      - name: Bandit
        run: bandit -r aegis/src/aegis packages/run-replay/src/run_replay packages/evalforge/src/evalforge packages/agent-sentinel/src/agent_sentinel packages/token-governor/src/token_governor packages/meshwork/src/meshwork -q --severity-level medium --confidence-level medium
      - name: Pytest
        run: pytest aegis/tests packages/run-replay/tests packages/evalforge/tests packages/agent-sentinel/tests packages/token-governor/tests packages/meshwork/tests -q
