name: quality-gate

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit pytest pytest-asyncio
          for p in aegis run-replay evalforge agent-sentinel token-governor meshwork; do
            if [ -f "$p/pyproject.toml" ]; then pip install -e "./$p" --no-deps || true; fi
          done
      - name: Ruff
        run: ruff check aegis/src run-replay/src evalforge/src agent-sentinel/src token-governor/src meshwork/src
      - name: Mypy
        run: mypy aegis/src/aegis --config-file aegis/pyproject.toml --no-error-summary
      - name: Bandit
        run: bandit -r aegis/src/aegis run-replay/src/run_replay evalforge/src/evalforge agent-sentinel/src/agent_sentinel token-governor/src/token_governor meshwork/src/meshwork -q
      - name: Pytest
        run: pytest aegis/tests run-replay/tests evalforge/tests agent-sentinel/tests token-governor/tests meshwork/tests -q
