[project]
name = "meshwork"
version = "1.0.0"
description = "Multi-agent workflow engine: plan/execute steps, generator-critic loops, retries, human gates, checkpoint/resume."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Deva Harsha Mummareddy" }]
keywords = ["agents", "orchestration", "workflows", "checkpointing", "human-in-the-loop"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
